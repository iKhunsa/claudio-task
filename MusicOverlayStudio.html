<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Music Overlay Studio</title>
<style>
:root{--brand:#F0213A;--bg-app:#F7F7F8;--bg-panel:#fff;--text-primary:#17171A;--text-secondary:#606068;--border-default:#E5E5E8;--tc:450ms}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#111216;color:#eee;-webkit-font-smoothing:antialiased}
body.overlay{background:transparent!important;overflow:hidden}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}

/* ============ OVERLAY BASE ============ */
.ov{position:relative;color:var(--fg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.2;flex:none}
.ov *{box-sizing:border-box}
.ov .pn{background:var(--panel);border:1px solid var(--line);box-shadow:var(--sh);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur))}
.ov .pn2{background:var(--panel2);border:1px solid var(--line);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur))}
@supports not (backdrop-filter:blur(1px)){.ov.v-glass .pn,.ov.v-glass .pn2{background:rgba(30,30,36,.62)}}
.ov .ttl{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-shadow:var(--ts);font-weight:700}
.ov .ttl.mq{text-overflow:clip}
.ov .ttl.mq span{display:inline-block;padding-right:40px;animation:mq 12s linear 3s infinite}
.ov.paused .ttl.mq span{animation-play-state:paused}
@keyframes mq{0%,15%{transform:translateX(0)}85%,100%{transform:translateX(var(--mqd))}}
.ov .art{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--fg2);text-shadow:var(--ts)}
.ov .tx{text-shadow:var(--ts)}
.ov .cv{background-size:cover;background-position:center;background-color:#555;flex:none}
.ov.cm-disc .cv.opt{border-radius:50%}
.ov.cm-none .cv.opt{display:none}
.ov .p{height:4px;border-radius:9px;background:rgba(127,127,127,.3);overflow:hidden;position:relative}
.ov .p i{display:block;height:100%;width:0;background:var(--acc);border-radius:9px}
.ov .tm{font-size:11px;font-variant-numeric:tabular-nums;color:var(--fg2);text-shadow:var(--ts);display:flex;justify-content:space-between}
.ov.np-p .p,.ov.np-p .tm,.ov.np-p .pr{display:none!important}
.ov.np-pl .plat{display:none!important}
.ov.np-rq .req{display:none!important}
.ov.np-q .que{display:none!important}
.ov .st{width:1em;height:1em;fill:currentColor}
.ov .st.pa{display:none}
.ov.paused .st.pl{display:none}
.ov.paused .st.pa{display:block}
.ov .plat,.ov .req,.ov .que{font-size:11px;color:var(--fg2);text-shadow:var(--ts);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov .eq{display:inline-flex;align-items:flex-end;gap:2px;height:14px}
.ov .eq i{width:3px;height:100%;background:var(--acc);border-radius:2px;transform-origin:bottom;animation:eq 900ms ease-in-out infinite alternate}
.ov .eq i:nth-child(2){animation-delay:-.3s;animation-duration:700ms}
.ov .eq i:nth-child(3){animation-delay:-.6s;animation-duration:1100ms}
.ov .eq i:nth-child(4){animation-delay:-.15s;animation-duration:800ms}
@keyframes eq{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ov .spin{animation:spin 9s linear infinite}
.ov.paused .spin,.ov.paused .anim,.ov.paused .eq i{animation-play-state:paused}
.ov.enter .meta{animation:rise var(--tc) cubic-bezier(.2,.8,.2,1) both}
.ov.enter .cv{animation:fadein var(--tc) ease both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.ov.m-off *,.ov.m-off{animation:none!important;transition:none!important}
.ov.m-subtle .spin{animation-duration:20s}
@media (prefers-reduced-motion:reduce){.ov *{animation:none!important;transition:none!important}}
.ov .idle{padding:14px 22px;border-radius:18px;font-size:14px;color:var(--fg2)}
.ov .loading .sk{background:rgba(127,127,127,.25);border-radius:8px;height:14px;animation:fadein 1s ease infinite alternate}

/* 01 Compact Disc Left */
.f01{width:460px;height:172px}
.f01 .body{position:absolute;left:112px;top:16px;width:348px;height:140px;border-radius:28px;padding:20px 22px 14px 72px;display:flex;flex-direction:column;justify-content:center;gap:5px}
.f01 .disc{position:absolute;left:0;top:6px;width:160px;height:160px;border-radius:50%;z-index:2;background:repeating-radial-gradient(circle at 50% 50%,#0d0d0f 0 1.5px,#1b1b1f 1.5px 3px);box-shadow:8px 10px 22px rgba(0,0,0,.45),0 0 0 2px #2c2c31 inset}
.f01 .disc:before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 20deg,transparent 0 10%,rgba(255,255,255,.16) 14%,transparent 22% 55%,rgba(255,255,255,.12) 62%,transparent 70%)}
.f01 .lab{position:absolute;inset:46px;border-radius:50%;box-shadow:0 0 0 3px #0b0b0c}
.f01 .hole{position:absolute;left:50%;top:50%;width:11px;height:11px;margin:-5.5px;border-radius:50%;background:#e9e9ee;box-shadow:inset 0 1px 3px rgba(0,0,0,.6)}
.f01 .ttl{font-size:18px}.f01 .art{font-size:13px}
.f01 .row{display:flex;align-items:center;gap:10px;margin-top:6px}.f01 .row .p{flex:1;height:4px}
.f01 .sub{display:flex;gap:10px;align-items:center;font-size:12px}
.f01 .stg{font-size:15px}

/* 02 Glass Sunset */
.f02{width:400px;height:270px}
.f02 .body{position:absolute;inset:0;border-radius:34px;padding:24px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--sh),0 14px 50px rgba(255,150,60,.18);background:linear-gradient(180deg,rgba(255,255,255,.12),transparent 40%),var(--panel)}
.f02 .top{display:flex;gap:16px;align-items:center}
.f02 .cv{width:80px;height:80px;border-radius:18px;box-shadow:0 6px 16px rgba(0,0,0,.35)}
.f02 .ttl{font-size:24px}.f02 .art{font-size:15px;margin-top:3px}
.f02 .meta{min-width:0;flex:1}
.f02 .p{height:5px}
.f02 .tm{margin-top:6px;font-size:12px}
.f02 .foot{display:flex;align-items:center;justify-content:space-between;font-size:14px;color:var(--fg);padding:0 4px}
.f02 .foot .dot{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--acc);color:#2a1d00;font-size:16px}
.f02 .foot .row{display:flex;gap:10px;align-items:center;color:var(--fg2)}
.f02.enter .body{animation:glow 900ms ease-out}
@keyframes glow{0%{box-shadow:var(--sh),0 0 0 2px rgba(255,255,255,.65)}100%{box-shadow:var(--sh),0 0 0 0 rgba(255,255,255,0)}}

/* 03 Arc Cover */
.f03{width:330px;height:370px}
.f03 .img{position:absolute;left:0;top:0;width:330px;height:236px;border-radius:165px 165px 165px 165px / 150px 150px 86px 86px;overflow:hidden;box-shadow:0 14px 28px rgba(0,0,0,.2);z-index:2}
.f03 .img .cv{position:absolute;inset:0;transform:scale(1.04)}
.f03 .mini{position:absolute;left:50%;top:14px;width:40px;height:40px;margin-left:-20px;border-radius:50%;border:3px solid rgba(255,255,255,.9);z-index:3;box-shadow:0 4px 10px rgba(0,0,0,.3)}
.f03 .body{position:absolute;left:8px;right:8px;top:196px;bottom:0;border-radius:38px;padding:62px 28px 18px;text-align:center}
.f03 .eq{height:16px;margin-bottom:4px}
.f03 .art{font-size:13px;margin-top:2px}.f03 .ttl{font-size:21px}
.f03 .p{margin:10px 0 4px;height:3px}

/* 04 Pastel Turntable */
.f04{width:430px;height:430px}
.f04 .body{position:absolute;inset:0;border-radius:50px;background:linear-gradient(145deg,var(--bd1),var(--bd2));box-shadow:14px 18px 36px rgba(60,90,130,.28),-8px -8px 20px rgba(255,255,255,.6),inset 2px 2px 3px rgba(255,255,255,.7),inset -3px -4px 8px rgba(70,110,160,.25);border:1px solid var(--line);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur))}
.f04 .plate{position:absolute;left:26px;top:26px;width:300px;height:300px;border-radius:50%;background:var(--panel2);box-shadow:inset 4px 6px 12px rgba(60,100,150,.3),inset -4px -4px 8px rgba(255,255,255,.7)}
.f04 .vinyl{position:absolute;left:34px;top:34px;width:284px;height:284px;border-radius:50%;background:repeating-radial-gradient(circle,rgba(0,0,0,.14) 0 1px,transparent 1px 3.5px),radial-gradient(circle,var(--acc),color-mix(in srgb,var(--acc) 70%,#04323a));box-shadow:0 8px 18px rgba(20,60,90,.4),0 0 0 3px rgba(255,255,255,.25) inset}
.f04 .vinyl:before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 8%,rgba(255,255,255,.4) 12%,transparent 18% 50%,rgba(255,255,255,.32) 58%,transparent 64%)}
.f04 .lab{position:absolute;inset:92px;border-radius:50%;box-shadow:0 0 0 4px rgba(255,255,255,.85),0 2px 8px rgba(0,0,0,.3)}
.f04 .hole{position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px;border-radius:50%;background:#e6f0f8}
.f04 .pivot{position:absolute;right:34px;top:34px;width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f4f9ff,#b9cfe4);box-shadow:0 6px 12px rgba(40,70,110,.35),inset 0 -3px 6px rgba(60,100,150,.3)}
.f04 .arm{position:absolute;right:65px;top:65px;width:0;height:0;transform-origin:0 0;transition:transform 1.1s cubic-bezier(.3,.7,.2,1);transform:rotate(var(--ang,22deg));z-index:4}
.f04.paused .arm{--ang:-4deg}
.f04 .arm .tube{position:absolute;left:-5px;top:0;width:10px;height:250px;border-radius:6px;background:linear-gradient(90deg,#1c1c20,#55555e 45%,#17171a);box-shadow:4px 6px 10px rgba(0,0,0,.3)}
.f04 .arm .head{position:absolute;left:-14px;top:238px;width:28px;height:44px;border-radius:7px;background:linear-gradient(90deg,#111,#3c3c42,#111);transform:rotate(-8deg);transform-origin:50% 0;box-shadow:3px 5px 8px rgba(0,0,0,.35)}
.f04 .arm .head:after{content:"";position:absolute;left:11px;bottom:-9px;width:6px;height:11px;background:#d9dde3;border-radius:0 0 3px 3px}
.f04 .arm .cw{position:absolute;left:-12px;top:-52px;width:24px;height:46px;border-radius:7px;background:linear-gradient(90deg,#17171a,#4a4a52,#17171a)}
.f04 .sw{position:absolute;right:30px;top:196px;width:50px;height:92px;border-radius:25px;background:var(--panel2);box-shadow:inset 3px 4px 8px rgba(60,100,150,.35),inset -3px -3px 6px rgba(255,255,255,.7)}
.f04 .sw:after{content:"";position:absolute;left:5px;top:5px;width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#c6d9ec);box-shadow:0 5px 8px rgba(40,70,110,.35);transition:transform .4s;transform:translateY(var(--sy,0))}
.f04.paused .sw:after{--sy:42px}
.f04 .info{position:absolute;left:34px;right:34px;bottom:26px;display:flex;align-items:center;gap:14px;height:62px;padding:0 20px;border-radius:24px;box-shadow:inset 3px 4px 8px rgba(60,100,150,.3),inset -3px -3px 6px rgba(255,255,255,.65);background:var(--panel2);border:none}
.f04 .meta{flex:1;min-width:0}
.f04 .ttl{font-size:16px;color:var(--fg)}.f04 .art{font-size:12px}
.f04 .p{margin-top:5px;height:3px}
.f04 .heart{color:var(--acc);font-size:20px;margin-left:auto}

/* 05 Spatial Carousel */
.f05{width:900px;height:440px;perspective:1100px}
.f05 .stage{position:absolute;inset:0;transform-style:preserve-3d}
.f05 .it{position:absolute;left:50%;top:34px;width:250px;height:250px;margin-left:-125px;border-radius:14px;background-size:cover;background-position:center;box-shadow:0 22px 40px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.15) inset;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.f05 .it:after{content:"";position:absolute;inset:0;border-radius:14px;background:linear-gradient(115deg,rgba(255,255,255,.28),transparent 40%);}
.f05 .it.c0{transform:translateZ(60px)}
.f05 .it.r1{transform:translateX(230px) translateZ(-120px) rotateY(-38deg)}
.f05 .it.r2{transform:translateX(390px) translateZ(-260px) rotateY(-45deg);opacity:.75}
.f05 .it.l1{transform:translateX(-230px) translateZ(-120px) rotateY(38deg)}
.f05 .it.l2{transform:translateX(-390px) translateZ(-260px) rotateY(45deg);opacity:.75}
.f05 .info{position:absolute;left:0;right:0;top:304px;text-align:center}
.f05 .ttl{font-size:22px;padding:0 160px}.f05 .art{font-size:14px;padding:0 160px}
.f05 .bar{position:absolute;left:50%;bottom:22px;width:420px;margin-left:-210px;height:50px;border-radius:25px;display:flex;align-items:center;gap:14px;padding:0 20px}
.f05 .bar .p{flex:1}
.f05 .bar .tm{gap:8px;justify-content:flex-start}

/* 06 Modular Dark Purple */
.f06{width:610px;height:230px}
.f06 .dots{position:absolute;left:0;top:0;font-size:30px;font-weight:900;letter-spacing:3px;color:transparent;background-image:radial-gradient(circle,var(--acc) 1.1px,transparent 1.6px);background-size:4px 4px;-webkit-background-clip:text;background-clip:text;line-height:1}
.f06 .mod1{position:absolute;left:0;top:30px;width:200px;height:200px;border-radius:44px;display:grid;place-items:center;box-shadow:8px 10px 20px rgba(0,0,0,.45),-4px -4px 12px rgba(255,255,255,.04),var(--sh)}
.f06 .ring{position:absolute;width:162px;height:162px;border-radius:50%;background:conic-gradient(from 0deg,var(--acc),#2a1f4d,var(--acc),#2a1f4d,var(--acc));-webkit-mask:radial-gradient(circle,transparent 58px,#000 59px 70px,transparent 71px);mask:radial-gradient(circle,transparent 58px,#000 59px 70px,transparent 71px)}
.f06 .core{position:absolute;width:104px;height:104px;border-radius:50%;box-shadow:inset 4px 4px 10px rgba(255,255,255,.1),inset -6px -8px 12px rgba(0,0,0,.6)}
.f06 .core .cv{width:100%;height:100%;border-radius:50%;opacity:.95}
.f06 .orb{position:absolute;inset:0;animation:spin 6s linear infinite}
.f06 .orb b{position:absolute;left:50%;top:14px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--acc)}
.f06 .orb b+b{top:auto;bottom:14px;width:8px;height:8px;margin-left:-4px;opacity:.7}
.f06 .mod2{position:absolute;left:212px;top:30px;width:398px;height:200px;border-radius:44px;padding:28px 30px;display:flex;flex-direction:column;justify-content:center;gap:6px;background:linear-gradient(135deg,var(--panel2),var(--panel));}
.f06 .ttl{font-size:26px}.f06 .art{font-size:14px}
.f06 .chp{align-self:flex-start;font-size:10px;letter-spacing:2px;padding:4px 10px;border-radius:20px;background:rgba(155,123,255,.18);color:var(--acc)}
.f06 .row{display:flex;align-items:center;gap:12px;margin-top:8px}.f06 .row .p{flex:1;height:8px;border-radius:5px}
.f06 .tmd{font-variant-numeric:tabular-nums;font-size:13px;color:var(--fg2)}

/* 07 Blue Transparent */
.f07{width:460px;height:255px}
.f07 .body{position:absolute;inset:0;border-radius:30px;border:1.5px solid rgba(255,255,255,.75);background:linear-gradient(160deg,color-mix(in srgb,var(--panel) 100%,transparent),var(--panel2));box-shadow:var(--sh),0 0 40px rgba(60,140,255,.25);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));padding:28px 36px;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:6px}
.f07 .lab{font-size:11px;letter-spacing:3px;color:var(--fg2)}
.f07 .ttl{font-size:26px}.f07 .art{font-size:16px}
.f07 .p{height:5px;margin:14px 8% 0;background:rgba(255,255,255,.3)}
.f07 .p i{background:linear-gradient(90deg,#2cff9a,#34e0ff)}
.f07 .tm{margin:6px 8% 0}
.f07 .chips{display:flex;justify-content:center;gap:16px;align-items:center;margin-top:12px;font-size:12px;color:var(--fg2)}

/* 08 Mechanical */
.f08{width:760px;height:390px}
.f08 .disc{position:absolute;left:330px;top:0;width:250px;height:250px;border-radius:50%;background:repeating-radial-gradient(circle,#050506 0 1.2px,#17171a 1.2px 2.6px);box-shadow:0 12px 24px rgba(0,0,0,.5);z-index:1}
.f08 .disc:before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 40deg,transparent 0 12%,rgba(255,255,255,.2) 17%,transparent 24% 58%,rgba(255,255,255,.14) 64%,transparent 70%)}
.f08 .disc .lab{position:absolute;inset:88px;border-radius:50%}
.f08 .panel{position:absolute;left:96px;top:70px;width:570px;height:300px;border-radius:30px;z-index:2;background:linear-gradient(160deg,var(--bd1),var(--bd2));border:1px solid var(--line);box-shadow:0 20px 36px rgba(0,0,0,.45),inset 0 2px 1px rgba(255,255,255,.35),inset 0 -4px 8px rgba(0,0,0,.35);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));padding:96px 150px 24px 160px;display:flex;flex-direction:column;gap:6px;justify-content:flex-end}
.f08 .panel:before{content:"";position:absolute;inset:0;border-radius:30px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 1px,transparent 1px 3px);pointer-events:none}
.f08 .ttl{font-size:24px}.f08 .art{font-size:14px}
.f08 .p{height:6px;background:rgba(0,0,0,.4);box-shadow:inset 0 1px 3px rgba(0,0,0,.6)}
.f08 .screw{position:absolute;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ddd,#666);box-shadow:0 1px 2px rgba(0,0,0,.6)}
.f08 .screw:after{content:"";position:absolute;left:1px;top:4px;width:8px;height:2px;background:#333;transform:rotate(35deg)}
.f08 .cover{position:absolute;left:0;top:96px;width:210px;height:210px;border-radius:22px;z-index:4;padding:10px;background:linear-gradient(145deg,#c9ccd2,#6c7078);box-shadow:10px 16px 26px rgba(0,0,0,.5),inset 0 2px 1px rgba(255,255,255,.6)}
.f08 .cover .cv{width:100%;height:100%;border-radius:14px;box-shadow:inset 0 0 0 2px rgba(0,0,0,.4)}
.f08 .knob{position:absolute;right:20px;top:150px;width:112px;height:112px;border-radius:50%;z-index:4;background:conic-gradient(from 30deg,#d8dbe0,#6e727a,#e8eaee,#5c6068,#d8dbe0);box-shadow:8px 12px 22px rgba(0,0,0,.5),inset 0 0 0 5px rgba(0,0,0,.35)}
.f08 .knob:after{content:"";position:absolute;inset:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8e929a,#40434a);box-shadow:inset 0 2px 3px rgba(255,255,255,.3)}
.f08 .knob i{position:absolute;left:50%;top:10px;width:5px;height:24px;margin-left:-2.5px;background:var(--acc);border-radius:3px;z-index:2;box-shadow:0 0 8px var(--acc);transform-origin:50% 46px}
.f08 .led{position:absolute;left:160px;top:96px;width:10px;height:10px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc);z-index:3}
.f08.paused .led{opacity:.25;box-shadow:none}

/* 09 Walkman */
.f09{width:640px;height:270px}
.f09 .body{position:absolute;inset:0;border-radius:28px;background:linear-gradient(150deg,var(--bd1),var(--bd2));border:5px solid #1a2a35;box-shadow:var(--sh);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur))}
.f09 .left{position:absolute;left:24px;top:24px;width:210px;bottom:24px;display:flex;flex-direction:column;justify-content:space-between}
.f09 .lcd{border-radius:10px;padding:10px 12px;background:#0f1d27;color:#7bf6ff;font-family:ui-monospace,Menlo,monospace}
.f09 .lcd .ttl{font-size:13px;font-weight:700;color:#7bf6ff}.f09 .lcd .art{font-size:11px;color:#46b4bd}
.f09 .lcd .p{margin-top:8px;height:3px}
.f09 .btns{display:flex;gap:8px;align-items:center}
.f09 .btns b{width:34px;height:34px;border-radius:50%;background:linear-gradient(#f4fbff,#a6c9dc);box-shadow:0 3px 0 #5b8399,0 5px 8px rgba(0,0,0,.25);display:grid;place-items:center;color:#1a2a35;font-size:14px}
.f09 .wm{font-weight:900;font-style:italic;letter-spacing:1px;font-size:20px;color:var(--fg)}
.f09 .wm span{color:var(--acc2)}
.f09 svg.cas{position:absolute;right:20px;top:26px;width:366px;height:218px}
.f09 .reel{transform-box:fill-box;transform-origin:center;animation:spin 3s linear infinite}
.f09 .reel.b{animation-duration:3.6s}

/* 10 Ambient Album Carousel */
.f10{width:900px;height:520px;perspective:1000px;overflow:visible}
.f10 .amb{position:absolute;inset:-20px;border-radius:40px;overflow:hidden;filter:blur(2px);background:#0a0a0d;transition:background var(--tc)}
.f10 .amb i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.75;transition:background 1.2s}

<script>
(()=>{
'use strict';
/* =====================================================================
   MusicOverlayStudio — frontend 100% estático, sin dependencias externas.
   Familias CSS/SVG (sin WebGL): los objetos "3D" usan capas 2.5D.
   ===================================================================== */
const Q=new URLSearchParams(location.search);
const MODE=Q.get('mode')||'gallery';
const $=(s,e=document)=>e.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=ms=>{ms=Math.max(0,Math.floor(ms/1000));return Math.floor(ms/60)+':'+String(ms%60).padStart(2,'0')};

/* ---------- Cover art (SVG data URIs, sin red) ---------- */
const artCache={};
function art(kind,p){
  const k=kind+p.join();if(artCache[k])return artCache[k];
  const [a,b,c]=p;let body='';
  if(kind==='sun')body=`<rect width="300" height="300" fill="url(#g)"/><circle cx="150" cy="135" r="62" fill="${c}"/><path d="M0 210 Q80 160 160 205 T300 190 V300 H0Z" fill="${a}" opacity=".85"/><path d="M0 245 Q100 200 190 240 T300 225 V300 H0Z" fill="#2a1408" opacity=".75"/>`;
  else if(kind==='rings')body=`<rect width="300" height="300" fill="url(#g)"/>${[130,100,72,46,22].map((r,i)=>`<circle cx="150" cy="150" r="${r}" fill="none" stroke="${i%2?c:'#fff'}" stroke-opacity=".55" stroke-width="${6+i*2}"/>`).join('')}`;
  else if(kind==='grid')body=`<rect width="300" height="300" fill="url(#g)"/><path d="M0 190 L300 190" stroke="${c}" stroke-width="3"/>${Array.from({length:9},(_,i)=>`<path d="M150 190 L${i*38-20} 300" stroke="${c}" stroke-opacity=".8" stroke-width="2"/>`).join('')}<circle cx="150" cy="130" r="70" fill="${c}" opacity=".85"/>`;
  else body=`<rect width="300" height="300" fill="#2b2b30"/><g stroke="#3a3a41" stroke-width="14">${Array.from({length:9},(_,i)=>`<path d="M${-60+i*60} 300 L${60+i*60} 0"/>`).join('')}</g><path d="M130 200V105l60-14v88" stroke="#777" stroke-width="10" fill="none"/><circle cx="116" cy="204" r="18" fill="#777"/><circle cx="176" cy="190" r="18" fill="#777"/>`;
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${b}"/><stop offset="1" stop-color="${a}"/></linearGradient></defs>${body}</svg>`;
  return artCache[k]='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}

/* ---------- Datos de EJEMPLO (ficticios; solo galería/editor) ---------- */
const SAMPLES=[
  {id:'s1',title:'Dunas de Neón',artist:'Aurora Vega (ficticio)',album:'Horizonte',pal:['#ff8a2a','#ffd27a','#fff2b8'],kind:'sun',source:'spotify',durationMs:214000,requestedBy:{displayName:'@viewer_demo'},playlist:'Late Night Mix',volume:72},
  {id:'s2',title:'Océano Eléctrico',artist:'Marea Alta (ficticio)',album:'Corrientes',pal:['#1c5cff','#6fd3ff','#c8fff2'],kind:'rings',source:'youtube-music',durationMs:187000,playlist:'Chill Streams',volume:55},
  {id:'s3',title:'Medianoche en Tokio — versión extendida con un título larguísimo para probar el recorte',artist:'Los Satélites del Sur y Amigos Invitados (ficticio)',album:'Luces',pal:['#6a2bd9','#ff6fb5','#ffe36a'],kind:'grid',source:'apple-music',durationMs:305000,playlist:'Synthwave',volume:80},
  {id:'s4',title:'Sin portada ni duración',artist:'Artista Anónimo (ficticio)',pal:['#888','#aaa','#ddd'],kind:'none',source:'local',noCover:true,noDuration:true}
];
function mk(s,i,playing=true,pos){
  const nx=SAMPLES[(i+1)%SAMPLES.length];
  return {id:s.id,title:s.title,artist:s.artist,album:s.album,coverUrl:s.noCover?undefined:art(s.kind,s.pal),pal:s.pal,source:s.source,
    durationMs:s.noDuration?undefined:s.durationMs,positionMs:s.noDuration?undefined:(pos??s.durationMs*.38),isPlaying:playing,updatedAt:Date.now(),
    requestedBy:s.requestedBy,nextTrack:{title:nx.title,artist:nx.artist,coverUrl:nx.noCover?undefined:art(nx.kind,nx.pal)},playlist:s.playlist,volume:s.volume,metadataAvailable:true};
}
const sampleTrack=(i,pl=true,pos)=>mk(SAMPLES[i%SAMPLES.length],i%SAMPLES.length,pl,pos);

/* ---------- Helpers de render ---------- */
const nocover=t=>art('none',['#888','#aaa','#ddd']);
const covUrl=t=>(t&&t.coverUrl)||nocover();

const IDS=Object.keys(F);
const VARS=['white','black','transparent','glass','accent'];
const VLBL={white:'White',black:'Black',transparent:'Transparent',glass:'Glass',accent:'Accent'};

/* ---------- Tema ---------- */
function theme(fam,variant,o){
  const f=F[fam];let v;
  const base=variant==='transparent'?trans:variant==='glass'?glass:variant==='white'?light:variant==='black'?dark:(f.tone==='light'?light:dark);
  if(variant==='accent'||(variant==='white'&&f.tone==='light')||(variant==='black'&&f.tone==='dark'))v={...(f.tone==='light'?light:dark),...f.ref};
  else v={...base,acc:f.ref.acc,acc2:f.ref.acc2};
  // detalles propios de la silueta que se conservan en las variantes
  if(fam==='04'&&variant==='black'){v.bd1='#3a3d44';v.bd2='#16171a';v.panel2='#1e2024';v.fg='#e9eef4';v.fg2='#9aa5b3'}
  if(fam==='04'&&variant==='white'){v.bd1='#fff';v.bd2='#e8edf2';v.panel2='#eef2f6'}
  if(fam==='08'&&variant==='white'){v.bd1='#eceef1';v.bd2='#b9bdc4';v.fg='#16171a';v.fg2='#454952'}
  if(fam==='09'&&variant==='black'){v.bd1='#2a3036';v.bd2='#15181c';v.fg='#e9f7fb';v.fg2='#8fb3c0';v.acc2='#ff3cac';v.acc='#19dfee'}
  if(fam==='09'&&variant==='white'){v.bd1='#fafdff';v.bd2='#d6e4ec'}
  if(fam==='13'&&variant==='black'){v.back='#0f3a33';v.panel='#173f39';v.panel2='rgba(30,80,72,.9)';v.fg='#dffaf1';v.fg2='#8fd0c0'}
  if(fam==='13'&&variant==='white'){v.back='#eef4f2'}
  if(fam==='16'&&variant==='white'){v.bd1='#eef2f5';v.bd2='#cdd6dd';v.fg='#16222c';v.fg2='#556673'}
  if(fam==='16'&&variant==='black'){v.bd1='#2d3640';v.bd2='#12171c'}
  if(fam==='03'&&variant==='black'){v.panel='#242428';v.panel2='#17171a'}
  if(fam==='15'&&variant==='black'){v.panel='rgba(38,24,20,.92)';v.fg='#ffeede';v.fg2='#c79a7e'}
  if(fam==='06'&&variant==='white'){v.panel='#fff';v.panel2='#efeaff';v.fg='#1c1530';v.fg2='#6d6490';v.line='rgba(120,90,200,.2)'}
  if(variant==='accent'&&o.accentSource!=='reference'){
    const c=o.accentSource==='custom'?(o.accentColor||'#7c5cff'):o.accentSource==='brand'?'#F0213A':((o.track&&o.track.pal&&o.track.pal[0])||v.acc);
    v.acc=c;
  }
  v.acc2=v.acc2||v.acc;
  return v;
}

/* ---------- Mount ---------- */
const mounted=new Set();
function build(root,p){
  const f=F[p.fam];const t=p.track;
  root.className=`ov f${p.fam} v-${p.variant} cm-${p.o.coverMode||'square'} m-${p.o.motion||'full'}`+
   (p.o.showProgress===false?' np-p':'')+(p.o.showPlatform===false?' np-pl':'')+(p.o.showRequest===false?' np-rq':'')+(p.o.showQueue===false?' np-q':'')+
   (t&&t.isPlaying?'':' paused')+(p.enter?' enter':'');
  const th=theme(p.fam,p.variant,{...p.o,track:t});
  root.style.cssText=Object.entries(th).map(([k,v])=>`--${k}:${v}`).join(';')+`;width:${f.w}px;height:${f.h}px;--tc:${p.o.trans||450}ms`;
  if(!t){root.innerHTML=p.idle?`<div class="pn idle">Sin reproducción</div>`:'';return}
  if(p.loading){root.innerHTML=`<div class="pn loading" style="position:absolute;inset:0;border-radius:28px;padding:24px;display:flex;flex-direction:column;gap:12px;justify-content:center"><div class="sk" style="width:60%"></div><div class="sk" style="width:40%"></div></div>`;return}
  const o={...p.o,sub:p.sub};
  root.innerHTML=f.r(t,o,p.ctx||{});
  root.querySelectorAll('.ttl').forEach(el=>{const s=el.firstElementChild;if(s&&s.scrollWidth>el.clientWidth+2&&p.o.motion!=='off'){el.classList.add('mq');el.style.setProperty('--mqd',-(s.scrollWidth-el.clientWidth+40)+'px')}});
  if(p.enter)setTimeout(()=>root.classList.remove('enter'),(p.o.trans||450)+100);
  tickOne(root);
}
function mount(host,p){
  const root=document.createElement('div');root._p=p;
  host.appendChild(root);build(root,p);mounted.add(root);return root;
}
function update(root,patch){Object.assign(root._p,patch);build(root,root._p)}
function posOf(t,fixed){
  if(!hasD(t))return null;
  if(fixed!=null)return fixed*t.durationMs;
  const v=t.positionMs+(t.isPlaying?Date.now()-t.updatedAt:0);return Math.min(Math.max(0,v),t.durationMs);
}
function tickOne(root){
  const p=root._p,t=p.track;if(!t)return;
  const pos=posOf(t,p.fixed);
  const fr=pos==null?0:pos/t.durationMs;
  root.querySelectorAll('[data-fill]').forEach(e=>e.style.width=(fr*100)+'%');
  root.querySelectorAll('[data-cur]').forEach(e=>e.textContent=fmt(pos||0));
  root.querySelectorAll('[data-ring]').forEach(e=>{const c=+e.dataset.ring;e.setAttribute('stroke-dashoffset',c*(1-fr))});
  root.querySelectorAll('[data-wave] i').forEach((e,i,a)=>e.classList.toggle('on',i/a.length<fr));
  const ck=root.querySelector('[data-clock]');
  if(ck){const d=new Date();ck.textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');const dt=root.querySelector('[data-date]');if(dt)dt.textContent=d.toLocaleDateString('es',{weekday:'long',day:'numeric',month:'short'})}
}
setInterval(()=>{mounted.forEach(r=>{if(!r.isConnected){mounted.delete(r);return}tickOne(r)})},300);

/* ---------- Estado global ---------- */
const S={
  fam:Q.get('style')||'01',sub:Q.get('sub')||'A',variant:Q.get('variant')||'accent',
  accentSource:Q.get('accent')||'reference',accentColor:Q.get('color')?'#'+Q.get('color').replace('#',''):'#7c5cff',
  o:{coverMode:Q.get('cover')||'square',showProgress:Q.get('progress')!=='0',showPlatform:Q.get('platform')!=='0',showRequest:Q.get('request')!=='0',showQueue:Q.get('queue')!=='0',motion:Q.get('motion')||'full',trans:+(Q.get('trans')||450)},
  scale:+(Q.get('scale')||1),bg:'dark',trackIdx:0,playing:true,connected:true,loading:false,tab:MODE==='editor'?'editor':'gallery',
  track:null,history:[],queue:[]
};
S.history=[];
if(!F[S.fam])S.fam='01';
if(!VARS.includes(S.variant))S.variant='accent';
const oAll=()=>({...S.o,accentSource:S.accentSource,accentColor:S.accentColor});

/* ---------- API de datos (solo frontend) ---------- */
function normalize(x){
  if(!x||!x.title)return null;
  return {id:x.id||(x.title+'|'+x.artist),title:x.title,artist:x.artist||'',album:x.album,coverUrl:x.coverUrl,pal:x.pal,source:x.source,durationMs:x.durationMs,positionMs:x.positionMs,
   isPlaying:x.isPlaying!==false,updatedAt:x.updatedAt||Date.now(),requestedBy:x.requestedBy,nextTrack:x.nextTrack,playlist:x.playlist,volume:x.volume,metadataAvailable:true};
}
const live=new Set();
function setTrack(raw){
  const t=normalize(raw);const prev=S.track;
  S.track=t;
  live.forEach(r=>{
    const changed=!prev||!t||prev.id!==t.id;
    r._p.track=t;r._p.enter=changed&&!!t;
    r._p.ctx={history:S.history,queue:t&&t.nextTrack?[t.nextTrack].concat(S.queue):S.queue};
    build(r,r._p);
  });
}
window.MusicOverlayStudio={setTrack,clear:()=>setTrack(null),version:'1.0'};
window.addEventListener('message',e=>{const d=e.data;if(d&&d.type==='track')setTrack(d.track);if(d&&d.type==='clear')setTrack(null)});
try{const bc=new BroadcastChannel('tiklivetts-music');bc.onmessage=e=>{const d=e.data;if(d&&d.type==='track')setTrack(d.track);if(d&&d.type==='clear')setTrack(null)}}catch(_){}

/* ---------- Helpers de UI ---------- */
function h(html){const d=document.createElement('div');d.innerHTML=html.trim();return d.firstElementChild}
function fit(host,fam,sub,boxW,boxH,track,variant,extra={}){
  const f=F[fam];const wrap=document.createElement('div');wrap.className='fit';host.appendChild(wrap);
  const s=Math.min(boxW/(f.w+24),boxH/(f.h+24),1.4);
  wrap.style.cssText=`width:${f.w}px;height:${f.h}px;transform:translate(-50%,-50%) scale(${s})`;
  const root=mount(wrap,{fam,sub,variant,track,o:{...oAll(),...(extra.o||{})},fixed:extra.fixed??.38,ctx:extra.ctx||{history:[sampleTrack(3)],queue:[sampleTrack(1),sampleTrack(2)]}});
  root.classList.add('paused');
  return root;
}
const toast=m=>{const t=h(`<div class="toast">${esc(m)}</div>`);document.body.appendChild(t);setTimeout(()=>t.remove(),1800)};
function overlayURL(){
  const u=new URL(location.href);u.search='';
  const q=new URLSearchParams({mode:'overlay',style:S.fam,variant:S.variant,accent:S.accentSource,cover:S.o.coverMode,motion:S.o.motion,scale:S.scale,trans:S.o.trans});
  if(S.fam==='14')q.set('sub',S.sub);
  if(S.accentSource==='custom')q.set('color',S.accentColor.replace('#',''));
  if(!S.o.showProgress)q.set('progress','0');if(!S.o.showPlatform)q.set('platform','0');if(!S.o.showRequest)q.set('request','0');if(!S.o.showQueue)q.set('queue','0');
  return u.toString()+'?'+q.toString();
}
function syncURL(){
  if(MODE==='overlay')return;
  const u=overlayURL().replace('mode=overlay',S.tab==='editor'?'mode=editor':'mode=gallery');
  try{history.replaceState(null,'',u)}catch(_){}
}

/* ---------- MODO OVERLAY (OBS) ---------- */
function overlayMode(){
  document.body.classList.add('overlay');
  const host=$('#root');host.style.cssText='position:fixed;left:24px;top:24px;transform-origin:top left;transform:scale('+S.scale+')';
  if(Q.get('pos')==='br')host.style.cssText='position:fixed;right:24px;bottom:24px;transform-origin:bottom right;transform:scale('+S.scale+')';
  const r=mount(host,{fam:S.fam,sub:S.sub,variant:S.variant,track:null,o:oAll(),ctx:{}});
  live.add(r);
  if(Q.get('demo')==='1'){setTrack(sampleTrack(0))}   // solo para pruebas; nunca en producción
}

/* ---------- GALERÍA ---------- */
function gallery(host){
  const bgs=[['light','Claro'],['dark','Oscuro'],['game','Gameplay'],['sunset','Atardecer'],['alpha','Alfa']];
  const el=h(`<div class="gal"><div class="galtop"><span class="lbl">Fondo de demostración:</span>${bgs.map(([k,l])=>`<button class="chip ${S.bg===k?'on':''}" data-bg="${k}">${l}</button>`).join('')}<span class="lbl" style="margin-left:auto">Las miniaturas se animan al pasar el cursor. Datos de ejemplo ficticios.</span></div><div class="grid"></div></div>`);
  const grid=$('.grid',el);
  IDS.forEach(id=>{
    const f=F[id];const st={variant:'accent',sub:'A'};
    const c=h(`<div class="card"><div class="thumb bg-${S.bg}"></div><div class="meta2"><h3><span>${id}</span>${esc(f.name)}</h3><p>${esc(f.desc)}</p>
      <div class="tech">${esc(f.tech)}</div>${f.subs?`<div class="vs sb">${Object.keys(f.subs).map(k=>`<button data-sub="${k}" class="${k==='A'?'on':''}">${k}</button>`).join('')}</div>`:''}
      <div class="vs vv">${VARS.map(v=>`<button data-v="${v}" class="${v==='accent'?'on':''}">${VLBL[v]}</button>`).join('')}</div>
      <button class="go">Abrir en editor →</button></div></div>`);
    const th=$('.thumb',c);let root;
    const draw=()=>{th.innerHTML='';root=fit(th,id,st.sub,360,220,sampleTrack(0),st.variant)};
    draw();
    th.addEventListener('mouseenter',()=>{root.classList.remove('paused');root.classList.toggle('paused',false)});
    th.addEventListener('mouseleave',()=>root.classList.add('paused'));
    c.addEventListener('click',e=>{
      const b=e.target.closest('button');if(!b)return;
      if(b.dataset.v){st.variant=b.dataset.v;$$('.vv button',c).forEach(x=>x.classList.toggle('on',x===b));draw()}
      else if(b.dataset.sub){st.sub=b.dataset.sub;$$('.sb button',c).forEach(x=>x.classList.toggle('on',x===b));draw()}
      else if(b.classList.contains('go')){S.fam=id;S.variant=st.variant;S.sub=st.sub;S.tab='editor';render()}
    });
    grid.appendChild(c);
  });
  el.addEventListener('click',e=>{const b=e.target.closest('[data-bg]');if(!b)return;S.bg=b.dataset.bg;render()});
  host.appendChild(el);
}
const $$=(s,e=document)=>[...e.querySelectorAll(s)];

/* ---------- EDITOR ---------- */
let edRoot=null,fpsT=0,fpsN=0,fps=0;
function editor(host){
  if(!S.track)S.track=sampleTrack(S.trackIdx,S.playing);
  if(!S.history.length)S.history=[sampleTrack(3),sampleTrack(2)];
  const el=h(`<div class="edit"><aside class="l"><div class="sec">FAMILIA (16)</div><div class="fl" id="fl"></div></aside>
  <div class="estage bg-${S.bg}" id="stg"><div class="sbar" id="sbar"></div><div class="fit" id="fit"></div><div class="diag" id="diag"></div></div>
  <aside class="r" id="insp"></aside></div>`);
  host.appendChild(el);
  const fl=$('#fl',el);
  IDS.forEach(id=>{
    const b=h(`<button class="fi ${S.fam===id?'on':''}" data-f="${id}"><span class="n">${id}</span>${esc(F[id].name)}</button>`);fl.appendChild(b);
    if(id==='14'&&S.fam==='14')Object.entries(WATCH).forEach(([k,w])=>fl.appendChild(h(`<button class="fi sub ${S.sub===k?'on':''}" data-s="${k}">${w.n}</button>`)));
  });
  fl.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.f){S.fam=b.dataset.f;render()}else if(b.dataset.s){S.sub=b.dataset.s;render()}};
  const sbar=$('#sbar',el);
  [['light','Claro'],['dark','Oscuro'],['game','Gameplay'],['sunset','Atardecer'],['alpha','Alfa']].forEach(([k,l])=>{
    const b=h(`<button class="chip ${S.bg===k?'on':''}">${l}</button>`);b.onclick=()=>{S.bg=k;$('#stg').className='estage bg-'+k;$$('.chip',sbar).forEach(x=>x.classList.toggle('on',x===b))};sbar.appendChild(b);
  });
  // preview vivo
  const f=F[S.fam],fitEl=$('#fit',el);
  const root=mount(fitEl,{fam:S.fam,sub:S.sub,variant:S.variant,track:S.connected?S.track:null,idle:true,loading:S.loading,o:oAll(),
    ctx:{history:S.history,queue:S.track&&S.track.nextTrack?[S.track.nextTrack].concat(S.queue):S.queue}});
  edRoot=root;live.clear();live.add(root);
  const apply=()=>{
    const stg=$('#stg');if(!stg)return;
    const aw=stg.clientWidth-60,ah=stg.clientHeight-100;const sc=Math.min(aw/(f.w),ah/(f.h),1.6)*S.scale;
    fitEl.style.cssText=`width:${f.w}px;height:${f.h}px;transform:scale(${sc})`;
  };
  apply();window.onresize=apply;
  inspector(el,root,apply);
  diag();
}
function rebuild(root){
  root._p.variant=S.variant;root._p.sub=S.sub;root._p.o=oAll();root._p.track=S.connected?S.track:null;root._p.loading=S.loading;
  build(root,root._p);syncURL();diag();
}
function inspector(el,root,apply){
  const ins=$('#insp',el);
  const seg=(k,opts,cur)=>`<div class="seg" data-k="${k}">${opts.map(([v,l])=>`<button data-v="${v}" class="${String(cur)===String(v)?'on':''}">${l}</button>`).join('')}</div>`;
  const chk=(k,l,v)=>`<div class="row2"><label>${l}</label><input type="checkbox" data-c="${k}" ${v?'checked':''}></div>`;
  ins.innerHTML=`
  <div class="sec">VARIANTE</div>${seg('variant',VARS.map(v=>[v,VLBL[v]]),S.variant)}
  <div class="sec">ACENTO (variante Accent)</div>${seg('accentSource',[['reference','Referencia'],['album-art','Álbum'],['brand','Marca'],['custom','Custom']],S.accentSource)}
  <div class="row2"><label>Color custom</label><input type="color" id="cc" value="${S.accentColor}"></div>
  <div class="sec">PORTADA</div>${seg('coverMode',[['square','Square'],['disc','Disc'],['none','None']],S.o.coverMode)}
  <div class="sec">INFORMACIÓN VISIBLE</div>${chk('showProgress','Progreso',S.o.showProgress)}${chk('showPlatform','Plataforma',S.o.showPlatform)}${chk('showRequest','Pedida por',S.o.showRequest)}${chk('showQueue','Cola',S.o.showQueue)}
  <div class="sec">MOVIMIENTO</div>${seg('motion',[['off','Off'],['subtle','Sutil'],['full','Completo']],S.o.motion)}
  <div class="row2"><label>Escala <b id="sv">${S.scale.toFixed(2)}</b></label><input type="range" id="sc" min=".4" max="1.6" step=".05" value="${S.scale}"></div>
  <div class="row2"><label>Transición <b id="tv">${S.o.trans}</b> ms</label><input type="range" id="tr" min="100" max="1500" step="50" value="${S.o.trans}"></div>
  <div class="sec">SIMULADOR (solo editor)</div>
  <div class="row2"><label>Canción</label><select id="tk">${SAMPLES.map((s,i)=>`<option value="${i}" ${S.trackIdx===i?'selected':''}>${i+1}. ${esc(s.title.slice(0,24))}</option>`).join('')}</select></div>
  <button class="btn" id="pp">${S.playing?'⏸ Pausar':'▶ Reproducir'}</button><button class="btn" id="nx">⏭ Siguiente</button>
  <button class="btn" id="ld">Cargando</button><button class="btn" id="dc">${S.connected?'Desconectar':'Conectar'}</button><button class="btn" id="sk">Seek 80%</button>
  <div class="sec">SALIDA OBS</div>
  <button class="btn pri" id="cu">Copiar URL del overlay</button>
  <div class="note">Browser Source de OBS: pega la URL (fondo transparente real). Datos reales: <code>window.MusicOverlayStudio.setTrack({…})</code> o <code>postMessage({type:'track',track})</code>. Sin datos, el overlay no muestra nada.</div>
  <div class="sec">STYLE PICKER</div><div class="picker"><div class="note" style="margin:0 0 6px">Cada miniatura es el diseño real (CSS, sin WebGL).</div><div class="g" id="pk"></div></div>`;
  ins.onclick=e=>{
    const b=e.target.closest('.seg button');if(!b)return;
    const k=b.parentElement.dataset.k,v=b.dataset.v;
    if(k==='variant')S.variant=v;else if(k==='accentSource')S.accentSource=v;else S.o[k]=v;
    $$('button',b.parentElement).forEach(x=>x.classList.toggle('on',x===b));rebuild(root);
  };
  ins.onchange=e=>{const c=e.target.dataset.c;if(c){S.o[c]=e.target.checked;rebuild(root)}};
  $('#cc',ins).oninput=e=>{S.accentColor=e.target.value;S.accentSource='custom';rebuild(root)};
  $('#sc',ins).oninput=e=>{S.scale=+e.target.value;$('#sv').textContent=S.scale.toFixed(2);apply();syncURL()};
  $('#tr',ins).oninput=e=>{S.o.trans=+e.target.value;$('#tv').textContent=S.o.trans;rebuild(root)};
  $('#tk',ins).onchange=e=>{S.trackIdx=+e.target.value;changeTrack()};
  $('#nx',ins).onclick=()=>{S.history.push(S.track);S.history=S.history.slice(-2);S.trackIdx=(S.trackIdx+1)%SAMPLES.length;changeTrack(true)};
  $('#pp',ins).onclick=e=>{S.playing=!S.playing;const t=S.track;t.positionMs=posOf(t)??t.positionMs;t.updatedAt=Date.now();t.isPlaying=S.playing;root._p.track=t;root.classList.toggle('paused',!S.playing);e.target.textContent=S.playing?'⏸ Pausar':'▶ Reproducir'};
  $('#ld',ins).onclick=()=>{S.loading=true;rebuild(root);setTimeout(()=>{S.loading=false;rebuild(root)},1400)};
  $('#dc',ins).onclick=e=>{S.connected=!S.connected;e.target.textContent=S.connected?'Desconectar':'Conectar';rebuild(root)};
  $('#sk',ins).onclick=()=>{const t=S.track;if(hasD(t)){t.positionMs=t.durationMs*.8;t.updatedAt=Date.now()}};
  $('#cu',ins).onclick=()=>{const u=overlayURL();(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast('URL copiada'),()=>{prompt('Copia la URL:',u)})};
  function changeTrack(){
    const t=sampleTrack(S.trackIdx,S.playing);S.track=t;S.queue=[1,2].map(i=>sampleTrack(S.trackIdx+i));
    root._p.track=S.connected?t:null;root._p.enter=true;root._p.ctx={history:S.history,queue:[t.nextTrack,...S.queue.slice(1)]};build(root,root._p);diag();
  }
  const pk=$('#pk',ins);
  IDS.forEach(id=>{
    const b=h(`<button class="t ${id===S.fam?'on':''}"><em>${id}</em></button>`);
    const f=F[id];const w=document.createElement('div');w.className='fit';b.appendChild(w);
    w.style.cssText=`width:${f.w}px;height:${f.h}px;transform:translate(-50%,-52%) scale(${Math.min(88/f.w,62/f.h)})`;
    mount(w,{fam:id,sub:'A',variant:S.variant,track:sampleTrack(0),o:oAll(),fixed:.38,ctx:{history:[sampleTrack(3)],queue:[sampleTrack(1),sampleTrack(2)]}}).classList.add('paused');
    b.onclick=()=>{S.fam=id;render()};pk.appendChild(b);
  });
  S.queue=[1,2].map(i=>sampleTrack(S.trackIdx+i));
  if(!S.track.nextTrack)S.track=sampleTrack(S.trackIdx,S.playing);
}
function diag(){
  const d=$('#diag');if(!d)return;
  const f=F[S.fam];
  d.textContent=`Render: ${f.tech} · WebGL activos: 0 · Nodos DOM: ${edRoot?edRoot.querySelectorAll('*').length:0} · ~${fps} fps · Waveform/EQ: decorativo (no reactivo)`;
}
(function loop(){requestAnimationFrame(function f(ts){fpsN++;if(ts-fpsT>1000){fps=fpsN;fpsN=0;fpsT=ts;if(S.tab==='editor')diag()}requestAnimationFrame(f)})})();

/* ---------- Shell ---------- */
function render(){
  syncURL();
  const root=$('#root');root.innerHTML='';mounted.clear();
  const app=h(`<div class="app"><div class="apptop"><h1>TikLive<b>TTS</b> · Music Overlay Studio</h1><div class="tabs"><button data-t="gallery" class="${S.tab==='gallery'?'on':''}">Galería</button><button data-t="editor" class="${S.tab==='editor'?'on':''}">Editor</button></div></div><div class="scroll" id="sc"></div></div>`);
  root.appendChild(app);
  app.querySelector('.tabs').onclick=e=>{const b=e.target.closest('button');if(b){S.tab=b.dataset.t;render()}};
  const sc=$('#sc',app);
  if(S.tab==='gallery')gallery(sc);else{sc.style.overflow='hidden';editor(sc)}
}

if(MODE==='overlay')overlayMode();else render();
})();
</script>
</body>
</html>
